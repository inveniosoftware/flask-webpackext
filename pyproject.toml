[project]
name = "flask-webpackext"
description = "Webpack integration for Flask."
readme = "README.rst"
requires-python = ">=3.7"
license = "BSD-3-Clause"
authors = [
  { name = "CERN", email = "info@inveniosoftware.org" },
]
keywords = [
  "flask",
  "webpack",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
]
dependencies = [
  "flask>=0.11",
  "pywebpack>=2.1.0,<3.0.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/inveniosoftware/flask-webpackext"

[project.entry-points."flask.commands"]
webpack = "flask_webpackext.cli:webpack"

[project.optional-dependencies]
docs = []
tests = [
  "coverage>=4.0",
  "isort>=4.3.21",
  "pydocstyle>=1.0.0",
  "pytest-black>=0.6.0",
  "pytest-cache>=1.0",
  "pytest-cov>=1.8.0",
  "pytest>=2.8.0",
  "sphinx-click>=1.4.0",
  "sphinx>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "flask_webpackext/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/flask_webpackext",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = '--black --doctest-glob="*.rst" --doctest-modules --cov=flask_webpackext --cov-report=term-missing docs tests flask_webpackext'
testpaths = "tests flask_webpackext"
live_server_scope = "module"
